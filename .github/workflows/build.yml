name: Build BLE Verify Tweak

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'baojun_ble_verify/**'

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: baojun_ble_verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build rootless package
        run: |
          set -o pipefail
          make clean package THEOS_PACKAGE_SCHEME=rootless messages=yes 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: baojun_ble_verify/build.log

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baojun-ble-verify-deb
          path: baojun_ble_verify/packages/*.deb
